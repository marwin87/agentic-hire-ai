services:
  db:
    image: pgvector/pgvector:pg17
    container_name: agentic-hire-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentic_hire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-agentic_hire}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic_hire"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentic-hire-net
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      # Required: OpenRouter API key for LLM calls
      AGENTIC_HIRE_OPENROUTER_API_KEY: ${AGENTIC_HIRE_OPENROUTER_API_KEY}

      # Required: JWT secret key (generate with: python -c 'import secrets; print(secrets.token_urlsafe(32))')
      AGENTIC_HIRE_JWT_SECRET_KEY: ${AGENTIC_HIRE_JWT_SECRET_KEY:-dev_secret_key_change_in_production}

      # Required: PostgreSQL connection string
      AGENTIC_HIRE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentic_hire}:${POSTGRES_PASSWORD:-dev_password}@db:5432/${POSTGRES_DB:-agentic_hire}

      # Optional: OrioSearch job discovery service
      # Default points to host machine (Docker Desktop / Mac / Windows)
      # On Linux, may need: docker-compose up --add-host host.docker.internal:host-gateway
      AGENTIC_HIRE_ORIOSEARCH_BASE_URL: ${AGENTIC_HIRE_ORIOSEARCH_BASE_URL:-http://host.docker.internal:8000}

      # Optional: Logging level (INFO, DEBUG, ERROR)
      AGENTIC_HIRE_LOG_LEVEL: ${AGENTIC_HIRE_LOG_LEVEL:-INFO}

      # Optional: LangFuse tracing (if you have API keys)
      # LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      # LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}

    volumes:
      # Bind mount: CV files (user drops PDFs here from host)
      - ./data/cv:/app/data/cv

      # Named volume: ChromaDB vector store (persists across restarts)
      - chroma_db:/app/data/chroma_db

    # Optional: resource limits (adjust for your hardware)
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

    networks:
      - agentic-hire-net
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: /app/docker-entrypoint.sh
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Required: OpenRouter API key for LLM calls
      AGENTIC_HIRE_OPENROUTER_API_KEY: ${AGENTIC_HIRE_OPENROUTER_API_KEY}

      # Required: JWT secret key (generate with: python -c 'import secrets; print(secrets.token_urlsafe(32))')
      AGENTIC_HIRE_JWT_SECRET_KEY: ${AGENTIC_HIRE_JWT_SECRET_KEY:-dev_secret_key_change_in_production}

      # Required: PostgreSQL connection string
      AGENTIC_HIRE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentic_hire}:${POSTGRES_PASSWORD:-dev_password}@db:5432/${POSTGRES_DB:-agentic_hire}

      # Optional: OrioSearch job discovery service
      AGENTIC_HIRE_ORIOSEARCH_BASE_URL: ${AGENTIC_HIRE_ORIOSEARCH_BASE_URL:-http://host.docker.internal:8000}

      # Optional: Logging level (INFO, DEBUG, ERROR)
      AGENTIC_HIRE_LOG_LEVEL: ${AGENTIC_HIRE_LOG_LEVEL:-INFO}

    volumes:
      # Bind mount: CV files (user drops PDFs here from host)
      - ./data/cv:/app/data/cv

      # Named volume: ChromaDB vector store (persists across restarts)
      - chroma_db:/app/data/chroma_db

    # Health check for FastAPI
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Optional: resource limits (adjust for your hardware)
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

    networks:
      - agentic-hire-net
    restart: unless-stopped

volumes:
  # Named volume for persistent ChromaDB storage (deprecated in favor of PostgreSQL)
  chroma_db:
    driver: local
  # Named volume for persistent PostgreSQL data
  postgres_data:
    driver: local

networks:
  agentic-hire-net:
    driver: bridge

services:
  # ==========================================
  # AgenticHire AI Services
  # ==========================================

  db:
    image: pgvector/pgvector:pg17
    container_name: agentic-hire-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentic_hire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-agentic_hire}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic_hire"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    networks:
      - agentic-hire-net
    restart: unless-stopped

  frontend:
    container_name: agentic-hire-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:8000
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - agentic-hire-net
    restart: unless-stopped

  api:
    container_name: agentic-hire-api
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: /app/docker-entrypoint.sh
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Required: OpenRouter API key for LLM calls
      AGENTIC_HIRE_OPENROUTER_API_KEY: ${AGENTIC_HIRE_OPENROUTER_API_KEY}

      # Required: JWT secret key (generate with: python -c 'import secrets; print(secrets.token_urlsafe(32))')
      AGENTIC_HIRE_JWT_SECRET_KEY: ${AGENTIC_HIRE_JWT_SECRET_KEY}

      # Required: PostgreSQL connection string
      AGENTIC_HIRE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentic_hire}:${POSTGRES_PASSWORD:-dev_password}@db:5432/${POSTGRES_DB:-agentic_hire}

      # Optional: OrioSearch job discovery service (external, on host machine on port 8000)
      AGENTIC_HIRE_ORIOSEARCH_BASE_URL: http://host.docker.internal:8000

      # Optional: Logging level (INFO, DEBUG, ERROR) - set to DEBUG for detailed logging during development
      AGENTIC_HIRE_LOG_LEVEL: DEBUG

      # Optional: Environment mode (development or production) - development enables auto-reload
      AGENTIC_HIRE_ENVIRONMENT: ${AGENTIC_HIRE_ENVIRONMENT:-development}

    volumes:
      # Bind mount: CV files (user drops PDFs here from host)
      - ./data/cv:/app/data/cv

    # Health check for FastAPI API only (port 8000 inside container, 8001 on host)
    # Note: OrioSearch is checked once at startup in docker-entrypoint.sh
    # This checks that FastAPI itself is responding on /health endpoint
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # Resource limits: memory caps prevent OOM; CPU limits prevent runaway agents from saturating host
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 2G
          cpus: '1'

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

    networks:
      - agentic-hire-net
    restart: unless-stopped

volumes:
  # Named volume for persistent PostgreSQL data (primary storage)
  postgres_data:
    driver: local

networks:
  agentic-hire-net:
    driver: bridge

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgenticHire AI - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .dashboard-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 600px;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-size: 16px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .user-info {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }

        .user-field {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }

        .user-field:last-child {
            border-bottom: none;
        }

        .user-field label {
            font-weight: 600;
            color: #333;
        }

        .user-field value {
            color: #666;
            word-break: break-all;
        }

        .error {
            background: #ffebee;
            border: 1px solid #d32f2f;
            border-radius: 4px;
            padding: 12px;
            margin: 20px 0;
            color: #d32f2f;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .welcome-message {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-top: 30px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f9f9f9;
        }

        .upload-area:hover {
            border-color: #5568d3;
            background: #f0f0ff;
        }

        .upload-area.dragging {
            border-color: #4caf50;
            background: #e8f5e9;
        }

        .upload-area p {
            color: #666;
            margin: 10px 0;
            font-size: 14px;
        }

        .upload-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        #cv-file-input {
            display: none;
        }

        .file-info {
            font-size: 12px;
            color: #999;
            margin-top: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin: 15px 0;
            overflow: hidden;
            display: none;
        }

        .progress-bar.active {
            display: block;
        }

        .progress-fill {
            height: 100%;
            background: #667eea;
            width: 0%;
            transition: width 0.3s;
        }

        .upload-status {
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }

        .upload-status.show {
            display: block;
        }

        .upload-status.success {
            color: #4caf50;
            background: #e8f5e9;
            padding: 12px;
            border-radius: 4px;
        }

        .upload-status.error {
            color: #d32f2f;
            background: #ffebee;
            padding: 12px;
            border-radius: 4px;
        }

        .upload-status.loading {
            color: #667eea;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        textarea, input[type="number"] {
            font-size: 14px;
        }

        .search-status {
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }

        .search-status.show {
            display: block;
        }

        .search-status.success {
            color: #4caf50;
            background: #e8f5e9;
            padding: 12px;
            border-radius: 4px;
        }

        .search-status.error {
            color: #d32f2f;
            background: #ffebee;
            padding: 12px;
            border-radius: 4px;
        }

        .search-status.loading {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h1>AgenticHire AI</h1>

        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading your dashboard...</p>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // Token & API Management
        // ============================================

        function getAccessToken() {
            return localStorage.getItem("access_token");
        }

        async function makeRequest(endpoint, method, body, token) {
            const headers = { "Content-Type": "application/json" };
            if (token) headers["Authorization"] = `Bearer ${token}`;

            const options = { method, headers, credentials: "include" };
            if (body) options.body = JSON.stringify(body);

            return fetch(`/api${endpoint}`, options);
        }

        async function apiCall(endpoint, method, body = null) {
            let token = getAccessToken();

            // First attempt
            let response = await makeRequest(endpoint, method, body, token);

            // If 401 (token expired), refresh and retry once
            if (response.status === 401 && token) {
                const refreshed = await refreshToken();
                if (refreshed) {
                    token = getAccessToken();
                    response = await makeRequest(endpoint, method, body, token);
                }
            }

            if (!response.ok) {
                const error = await response.json();
                throw { status: response.status, ...error };
            }
            return response.json();
        }

        async function refreshToken() {
            try {
                const response = await fetch("/api/refresh", {
                    method: "POST",
                    credentials: "include"
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem("access_token", data.access_token);
                    return true;
                }
            } catch (error) {
                console.error("Token refresh failed:", error);
            }
            return false;
        }

        // ============================================
        // Dashboard Load
        // ============================================

        async function loadDashboard() {
            try {
                const data = await apiCall("/dashboard", "GET");
                displayDashboard(data);
            } catch (error) {
                if (error.status === 401) {
                    displayError("Session expired. Please log in again.");
                    setTimeout(() => window.location.href = "/", 2000);
                } else {
                    displayError(error.detail || "Failed to load dashboard");
                }
            }
        }

        function displayDashboard(data) {
            const content = document.getElementById("content");
            content.innerHTML = `
                <div class="welcome-message">${data.message}</div>
                <div class="user-info">
                    <div class="user-field">
                        <label>User ID:</label>
                        <value>${data.user_id}</value>
                    </div>
                    <div class="user-field">
                        <label>Email:</label>
                        <value>${data.email}</value>
                    </div>
                </div>

                <div class="section-title">Upload CV</div>
                <div class="upload-area" id="upload-area" ondrop="handleDrop(event)" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" onclick="document.getElementById('cv-file-input').click()">
                    <div class="upload-icon">📄</div>
                    <p><strong>Drag & drop your CV here</strong></p>
                    <p>or click to browse</p>
                    <p class="file-info">.pdf files only • Max 10MB</p>
                </div>
                <input type="file" id="cv-file-input" accept=".pdf" onchange="handleFileSelect(event)">
                <div class="progress-bar" id="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="upload-status" id="upload-status"></div>

                <div class="section-title">Job Search</div>
                <label for="search-criteria">Search Criteria:</label>
                <textarea id="search-criteria" placeholder="e.g., Python engineer, remote, SaaS background, 5+ years experience" style="width: 100%; height: 80px; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; font-family: inherit;"></textarea>
                <label for="max-results">Max Results:</label>
                <input type="number" id="max-results" value="3" min="1" max="20" style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px;">

                <button id="search-btn" onclick="startSearch()" style="margin-top: 15px;">🔍 Search Jobs</button>
                <div class="search-status" id="search-status"></div>

                <div id="search-results" style="display: none; margin-top: 30px;">
                    <div class="section-title">Search Results</div>
                    <div id="results-content"></div>
                </div>

                <button onclick="logout()" style="margin-top: 30px; background: #ccc; color: #333;">Log Out</button>
            `;
            setupUploadHandlers();
        }

        function displayError(message) {
            const content = document.getElementById("content");
            content.innerHTML = `
                <div class="error">${message}</div>
                <button onclick="window.location.href = '/'">Back to Login</button>
            `;
        }

        function logout() {
            localStorage.removeItem("access_token");
            window.location.href = "/";
        }

        // ============================================
        // CV Upload Handlers
        // ============================================

        function handleDragOver(event) {
            event.preventDefault();
            event.stopPropagation();
            document.getElementById("upload-area").classList.add("dragging");
        }

        function handleDragLeave(event) {
            event.preventDefault();
            event.stopPropagation();
            document.getElementById("upload-area").classList.remove("dragging");
        }

        function handleDrop(event) {
            event.preventDefault();
            event.stopPropagation();
            document.getElementById("upload-area").classList.remove("dragging");

            const files = event.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        }

        function handleFileSelect(event) {
            const files = event.target.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        }

        function handleFile(file) {
            const statusEl = document.getElementById("upload-status");

            // Validate file type
            if (file.type !== "application/pdf") {
                statusEl.textContent = "❌ Invalid file type. Only PDF files are allowed.";
                statusEl.className = "upload-status error show";
                return;
            }

            // Validate file size (10MB = 10485760 bytes)
            const maxSize = 10 * 1024 * 1024;
            if (file.size > maxSize) {
                statusEl.textContent = `❌ File too large. Maximum size is 10MB. Your file is ${(file.size / 1024 / 1024).toFixed(1)}MB.`;
                statusEl.className = "upload-status error show";
                return;
            }

            // Proceed with upload
            uploadCV(file);
        }

        async function uploadCV(file) {
            const token = getAccessToken();
            const statusEl = document.getElementById("upload-status");
            const progressBar = document.getElementById("progress-bar");
            const progressFill = document.getElementById("progress-fill");

            try {
                // Show progress bar
                progressBar.classList.add("active");
                statusEl.textContent = "⏳ Uploading CV...";
                statusEl.className = "upload-status loading show";

                // Create FormData
                const formData = new FormData();
                formData.append("file", file);

                // Upload
                const response = await fetch("/api/upload_cv", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    },
                    body: formData,
                    credentials: "include"
                });

                progressFill.style.width = "100%";

                if (!response.ok) {
                    const error = await response.json();
                    statusEl.textContent = `❌ Upload failed: ${error.detail || "Unknown error"}`;
                    statusEl.className = "upload-status error show";
                    progressBar.classList.remove("active");
                    return;
                }

                const data = await response.json();

                // Show success
                statusEl.innerHTML = `✅ CV uploaded successfully!<br><strong>${data.chunks_stored} chunks created</strong>`;
                statusEl.className = "upload-status success show";
                progressBar.classList.remove("active");

                // Clear file input
                document.getElementById("cv-file-input").value = "";
            } catch (error) {
                console.error("Upload error:", error);
                statusEl.textContent = "❌ Upload failed. Please try again.";
                statusEl.className = "upload-status error show";
                progressBar.classList.remove("active");
            }
        }

        function setupUploadHandlers() {
            // Handlers are already set up in the HTML
        }

        // ============================================
        // Job Search
        // ============================================

        async function startSearch() {
            const criteria = document.getElementById("search-criteria").value.trim();
            const maxResults = parseInt(document.getElementById("max-results").value) || 5;
            const statusEl = document.getElementById("search-status");
            const searchBtn = document.getElementById("search-btn");
            const resultsDiv = document.getElementById("search-results");

            if (!criteria) {
                statusEl.textContent = "❌ Please enter search criteria.";
                statusEl.className = "search-status show error";
                return;
            }

            try {
                searchBtn.disabled = true;
                statusEl.textContent = "⏳ Searching for jobs...";
                statusEl.className = "search-status loading show";

                const response = await apiCall("/scout", "POST", {
                    criteria: criteria,
                    max_results: maxResults
                });

                const count = response.count || 0;
                const status = response.status || "Search complete";

                if (count > 0) {
                    displaySearchResults(response);
                    statusEl.textContent = `✅ Found ${count} job(s)!`;
                    statusEl.className = "search-status success show";
                } else {
                    statusEl.textContent = `ℹ️ No jobs found. Status: ${status}`;
                    statusEl.className = "search-status show";
                }
            } catch (error) {
                console.error("Search error:", error);
                statusEl.textContent = `❌ Search failed: ${error.detail || error.message || "Unknown error"}`;
                statusEl.className = "search-status error show";
            } finally {
                searchBtn.disabled = false;
            }
        }

        function displaySearchResults(response) {
            const resultsDiv = document.getElementById("search-results");
            const resultsContent = document.getElementById("results-content");
            const jobs = response.found_jobs || [];

            let html = `<p><strong>Search ID:</strong> ${response.search_id}</p>`;
            html += `<p><strong>Criteria:</strong> ${response.criteria}</p>`;
            html += `<p><strong>Found:</strong> ${response.count} job(s)</p>`;
            html += `<p><strong>Timestamp:</strong> ${new Date(response.timestamp).toLocaleString()}</p>`;

            if (jobs.length > 0) {
                html += `<div style="margin-top: 20px;">`;
                jobs.forEach((job, index) => {
                    html += `
                        <div style="background: #f9f9f9; padding: 15px; margin: 10px 0; border-radius: 6px; border-left: 4px solid #667eea;">
                            <h3 style="margin: 0 0 10px 0; color: #333;">${index + 1}. ${job.title || 'N/A'}</h3>
                            <p style="margin: 5px 0;"><strong>Company:</strong> ${job.company || 'N/A'}</p>
                            <p style="margin: 5px 0;"><strong>URL:</strong> <a href="${job.url}" target="_blank" style="color: #667eea;">${job.url || 'N/A'}</a></p>
                            ${job.salary_range ? `<p style="margin: 5px 0;"><strong>Salary:</strong> ${job.salary_range}</p>` : ''}
                            ${job.description ? `<p style="margin: 5px 0;"><strong>Description:</strong> ${job.description.substring(0, 200)}...</p>` : ''}
                        </div>
                    `;
                });
                html += `</div>`;
            }

            resultsContent.innerHTML = html;
            resultsDiv.style.display = "block";
        }

        // ============================================
        // Initialize
        // ============================================

        document.addEventListener("DOMContentLoaded", () => {
            const token = getAccessToken();
            if (!token) {
                displayError("Not authenticated. Please log in.");
                setTimeout(() => window.location.href = "/", 2000);
                return;
            }
            loadDashboard();
        });
    </script>
</body>
</html>

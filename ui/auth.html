<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgenticHire AI - Authentication</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #auth-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        #error-banner {
            display: none;
            background: #ffebee;
            border: 1px solid #d32f2f;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 20px;
            color: #d32f2f;
            font-size: 14px;
        }

        #success-message {
            display: none;
            background: #e8f5e9;
            border: 1px solid #4caf50;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 20px;
            color: #2e7d32;
            font-size: 14px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input[type="email"].error-input,
        input[type="password"].error-input {
            border-color: #d32f2f;
        }

        .error {
            color: #d32f2f;
            font-size: 12px;
            margin-top: 4px;
        }

        #password-hints {
            margin-top: 12px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 4px;
            font-size: 12px;
        }

        .hint {
            margin-bottom: 6px;
            color: #d32f2f;
            display: flex;
            align-items: center;
        }

        .hint.valid {
            color: #4caf50;
        }

        .hint::before {
            content: "✗ ";
            margin-right: 6px;
            font-weight: bold;
        }

        .hint.valid::before {
            content: "✓ ";
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover:not(:disabled) {
            background: #5568d3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .form-toggle {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 14px;
        }

        .form-toggle a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .form-toggle a:hover {
            text-decoration: underline;
        }

        #signup-form,
        #login-form {
            display: none;
        }

        #signup-form.active,
        #login-form.active {
            display: block;
        }

        #signup-form {
            display: block;
        }

        .form-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="auth-container">
        <h1>AgenticHire AI</h1>

        <div id="error-banner"></div>
        <div id="success-message"></div>

        <!-- Signup Form -->
        <div id="signup-form" class="active">
            <div class="form-title">Create Account</div>

            <form>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>

                    <div id="password-hints">
                        <div id="hint-length" class="hint invalid">At least 8 characters</div>
                        <div id="hint-digit" class="hint invalid">At least 1 digit (0-9)</div>
                        <div id="hint-uppercase" class="hint invalid">At least 1 uppercase letter (A-Z)</div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password_confirm">Confirm Password</label>
                    <input type="password" id="password_confirm" name="password_confirm" required>
                </div>

                <button type="submit" id="signup-btn" disabled>Sign Up</button>
            </form>

            <div class="form-toggle">
                Already have an account? <a id="toggle-login">Log in</a>
            </div>
        </div>

        <!-- Login Form -->
        <div id="login-form">
            <div class="form-title">Log In</div>

            <form>
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" required>
                </div>

                <button type="submit" id="login-btn">Log In</button>
            </form>

            <div class="form-toggle">
                Don't have an account? <a id="toggle-signup">Sign up</a>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // API Client & Token Management
        // ============================================

        async function makeRequest(endpoint, method, body, token) {
            const headers = { "Content-Type": "application/json" };
            if (token) headers["Authorization"] = `Bearer ${token}`;

            const options = { method, headers, credentials: "include" };
            if (body) options.body = JSON.stringify(body);

            return fetch(`/api${endpoint}`, options);
        }

        async function apiCall(endpoint, method, body = null) {
            let token = localStorage.getItem("access_token");

            // First attempt
            let response = await makeRequest(endpoint, method, body, token);

            // If 401 (token expired), refresh and retry once
            if (response.status === 401 && token) {
                const refreshed = await refreshToken();
                if (refreshed) {
                    token = localStorage.getItem("access_token");
                    response = await makeRequest(endpoint, method, body, token);
                }
            }

            if (!response.ok) {
                const error = await response.json();
                throw { status: response.status, ...error };
            }
            return response.json();
        }

        function storeTokens(accessToken, refreshToken) {
            localStorage.setItem("access_token", accessToken);
        }

        function clearTokens() {
            localStorage.removeItem("access_token");
        }

        function getAccessToken() {
            return localStorage.getItem("access_token");
        }

        async function refreshToken() {
            try {
                const response = await fetch("/api/refresh", {
                    method: "POST",
                    credentials: "include"
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem("access_token", data.access_token);
                    return true;
                }
            } catch (error) {
                console.error("Token refresh failed:", error);
            }
            return false;
        }

        // ============================================
        // Password Validation
        // ============================================

        function checkPasswordStrength(password) {
            return {
                length: password.length >= 8,
                digit: /\d/.test(password),
                uppercase: /[A-Z]/.test(password)
            };
        }

        function updatePasswordHints(password) {
            const hints = checkPasswordStrength(password);
            document.getElementById("hint-length").className = hints.length ? "hint valid" : "hint invalid";
            document.getElementById("hint-digit").className = hints.digit ? "hint valid" : "hint invalid";
            document.getElementById("hint-uppercase").className = hints.uppercase ? "hint valid" : "hint invalid";

            // Disable submit if not all requirements met
            const allValid = Object.values(hints).every(Boolean);
            document.getElementById("signup-btn").disabled = !allValid;
        }

        // ============================================
        // Error & Success Display
        // ============================================

        function showInlineError(fieldName, message) {
            const field = document.getElementById(fieldName);
            field.classList.add("error-input");

            // Remove existing error if present
            const existingError = field.nextElementSibling;
            if (existingError && existingError.className === "error") {
                existingError.remove();
            }

            const errorDiv = document.createElement("div");
            errorDiv.className = "error";
            errorDiv.textContent = message;
            field.parentNode.insertBefore(errorDiv, field.nextSibling);
        }

        function clearInlineErrors() {
            document.querySelectorAll(".error").forEach(el => el.remove());
            document.querySelectorAll(".error-input").forEach(el => el.classList.remove("error-input"));
        }

        function showBannerError(message) {
            const banner = document.getElementById("error-banner");
            banner.textContent = message;
            banner.style.display = "block";
        }

        function clearBannerError() {
            document.getElementById("error-banner").style.display = "none";
        }

        function showSuccessMessage(message) {
            const successDiv = document.getElementById("success-message");
            successDiv.textContent = message;
            successDiv.style.display = "block";
        }

        function clearSuccessMessage() {
            document.getElementById("success-message").style.display = "none";
        }

        // ============================================
        // Form Toggle
        // ============================================

        function toggleForm(form) {
            clearBannerError();
            clearInlineErrors();
            clearSuccessMessage();

            const signupForm = document.getElementById("signup-form");
            const loginForm = document.getElementById("login-form");

            if (form === "signup") {
                signupForm.style.display = "block";
                loginForm.style.display = "none";
                document.getElementById("email").value = "";
                document.getElementById("password").value = "";
                document.getElementById("password_confirm").value = "";
                updatePasswordHints("");
            } else {
                signupForm.style.display = "none";
                loginForm.style.display = "block";
                document.getElementById("login-email").value = "";
                document.getElementById("login-password").value = "";
            }
        }

        // ============================================
        // Signup Handler
        // ============================================

        async function handleSignup(email, password, passwordConfirm) {
            clearBannerError();
            clearInlineErrors();

            // Validate password_confirm matches
            if (password !== passwordConfirm) {
                showInlineError("password_confirm", "Passwords do not match");
                return;
            }

            try {
                const data = await apiCall("/signup", "POST", { email, password });
                storeTokens(data.access_token, data.refresh_token);
                showSuccessMessage("Account created! Redirecting to login...");
                setTimeout(() => toggleForm("login"), 2000);
            } catch (error) {
                if (error.status === 409) {
                    showInlineError("email", "Email already registered");
                } else if (error.status === 400) {
                    showInlineError("password", error.detail || "Invalid password");
                } else {
                    showBannerError(error.detail || "Signup failed. Please try again.");
                }
            }
        }

        // ============================================
        // Login Handler
        // ============================================

        async function handleLogin(email, password) {
            clearBannerError();
            clearInlineErrors();

            try {
                const data = await apiCall("/login", "POST", { email, password });
                storeTokens(data.access_token, data.refresh_token);
                showSuccessMessage("Logged in! Redirecting to dashboard...");
                setTimeout(() => window.location.href = "/dashboard", 2000);
            } catch (error) {
                if (error.status === 401) {
                    showBannerError("Invalid email or password");
                } else {
                    showBannerError(error.detail || "Login failed. Please try again.");
                }
            }
        }

        // ============================================
        // Logout Handler
        // ============================================

        function logout() {
            clearTokens();
            clearBannerError();
            clearInlineErrors();
            showSuccessMessage("Logged out. Redirecting to signup...");
            setTimeout(() => toggleForm("signup"), 2000);
        }

        // ============================================
        // Event Listeners
        // ============================================

        document.addEventListener("DOMContentLoaded", () => {
            // Password validation on input
            document.getElementById("password").addEventListener("input", (e) => {
                updatePasswordHints(e.target.value);
            });

            // Signup form submission
            document.getElementById("signup-form").addEventListener("submit", (e) => {
                e.preventDefault();
                const email = document.getElementById("email").value;
                const password = document.getElementById("password").value;
                const passwordConfirm = document.getElementById("password_confirm").value;
                handleSignup(email, password, passwordConfirm);
            });

            // Login form submission
            document.getElementById("login-form").addEventListener("submit", (e) => {
                e.preventDefault();
                const email = document.getElementById("login-email").value;
                const password = document.getElementById("login-password").value;
                handleLogin(email, password);
            });

            // Form toggle
            document.getElementById("toggle-login").addEventListener("click", (e) => {
                e.preventDefault();
                toggleForm("login");
            });

            document.getElementById("toggle-signup").addEventListener("click", (e) => {
                e.preventDefault();
                toggleForm("signup");
            });

            // Check if user is already logged in
            const token = localStorage.getItem("access_token");
            if (token) {
                console.log("User is authenticated; token persists");
            }
        });
    </script>
</body>
</html>

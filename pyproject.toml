[project]
name = "agentic-hire-ai"
version = "0.1.0"
description = "Autonomous multi-agent job application system using LangGraph, RAG, and Vision-based CV understanding."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.5",
    "alembic>=1.13.0",
    "asyncpg>=0.30.0",
    "beautifulsoup4>=4.14.3",
    "email-validator>=2.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "langchain>=1.2.15,<1.3.0",
    "langchain-community>=0.4.1,<0.5.0",
    "langchain-openai>=1.2.0,<1.3.0",
    "loguru>=0.7.2",
    "pdf2image>=1.17.0",
    "playwright>=1.40.0",
    "pgvector>=0.3.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.0.0",
    "pymupdf>=1.27.2.2",
    "pypdf>=6.10.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.9",
    "PyJWT>=2.8.0",
    "passlib[argon2]>=1.7.4",
    "sqlalchemy[asyncio]>=2.0.25",
    "uvicorn[standard]>=0.32.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true

[dependency-groups]
dev = [
    "black[d]>=26.3.1",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.14.0",
]

name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  AGENTIC_HIRE_OPENROUTER_API_KEY: test_key_for_ci
  AGENTIC_HIRE_JWT_SECRET_KEY: test_jwt_secret_key_for_ci_32chars_min
  POSTGRES_USER: agentic_hire
  POSTGRES_PASSWORD: dev_password
  POSTGRES_DB: agentic_hire

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync

      - name: Check formatting
        run: uv run black --check src tests main.py

      - name: Type check
        run: uv run mypy src

      - name: Run tests
        env:
          AGENTIC_HIRE_DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
          AGENTIC_HIRE_OPENROUTER_API_KEY: test_key_for_ci
          AGENTIC_HIRE_JWT_SECRET_KEY: test_jwt_secret_key_for_ci
          AGENTIC_HIRE_ORIOSEARCH_BASE_URL: http://localhost:8000
        run: |
          uv run pytest tests \
            -v \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=80

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run type-check

  integration:
    name: Integration & E2E
    runs-on: ubuntu-latest
    needs:
      - python
      - frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build Docker images
        run: docker compose build

      - name: Start Docker Compose
        run: docker compose up -d --wait --timeout 120

      - name: Verify services
        run: |
          curl -f http://localhost:8001/health
          curl -f http://localhost:3000

      - name: Run Playwright tests
        working-directory: frontend
        env:
          BACKEND_URL: http://localhost:8001
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Test graceful shutdown
        if: always()
        run: |
          docker compose stop

          if docker compose ps --status=running -q | grep -q .; then
            echo "ERROR: Containers are still running."
            docker compose ps -a
            exit 1
          fi

          api_status=$(docker inspect agentic-hire-api \
            --format='{{.State.ExitCode}}' 2>/dev/null || echo "unknown")

          if [ "$api_status" = "137" ]; then
            echo "ERROR: API was force-killed instead of shutting down gracefully."
            exit 1
          fi

          echo "✓ API exited cleanly (exit code: $api_status)"

      - name: Cleanup
        if: always()
        run: docker compose down -v

name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync

      - name: Format check with Black
        run: uv run black --check src/ tests/ main.py ui.py

      - name: Type check with mypy
        run: uv run mypy src/

      - name: Run tests
        env:
          AGENTIC_HIRE_DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
          AGENTIC_HIRE_OPENROUTER_API_KEY: test_key_for_ci
          AGENTIC_HIRE_JWT_SECRET_KEY: test_jwt_secret_key_for_ci
          AGENTIC_HIRE_ORIOSEARCH_BASE_URL: http://localhost:8000
        run: |
          uv run pytest tests/ -v --tb=short \
            --ignore=tests/test_api_endpoints.py \
            --ignore=tests/tools/test_job_validator.py \
            --ignore=tests/tools/test_scrape.py \
            --ignore=tests/tools/test_search.py

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: false
          tags: agentic-hire-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-compose-test:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Compose services
        env:
          AGENTIC_HIRE_OPENROUTER_API_KEY: test_key_for_ci
          POSTGRES_USER: agentic_hire
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: agentic_hire
        run: docker compose build

      - name: Start services
        env:
          AGENTIC_HIRE_OPENROUTER_API_KEY: test_key_for_ci
          POSTGRES_USER: agentic_hire
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: agentic_hire
        run: docker compose up -d --wait --timeout 120

      - name: Check if services are healthy
        run: |
          # Check database
          docker compose exec -T db pg_isready -U agentic_hire || exit 1

          # Check API health (api service maps 8001:8000)
          curl -f http://localhost:8001/health || exit 1

      - name: Cleanup
        if: always()
        run: docker compose down -v

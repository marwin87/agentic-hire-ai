name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync

      - name: Format check with Black
        run: uv run black --check src/ tests/ main.py

      - name: Type check with mypy
        run: uv run mypy src/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend type check
        run: npm run type-check
        working-directory: frontend

      - name: Run tests with coverage
        env:
          AGENTIC_HIRE_DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
          AGENTIC_HIRE_OPENROUTER_API_KEY: test_key_for_ci
          AGENTIC_HIRE_JWT_SECRET_KEY: test_jwt_secret_key_for_ci
          AGENTIC_HIRE_ORIOSEARCH_BASE_URL: http://localhost:8000
        run: |
          uv run pytest tests/ -v --tb=short \
            --cov=src --cov-report=term-missing --cov-fail-under=80

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: false
          tags: agentic-hire-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Build and start Docker stack
        env:
          AGENTIC_HIRE_OPENROUTER_API_KEY: test_key_for_ci
          AGENTIC_HIRE_JWT_SECRET_KEY: test_jwt_secret_key_for_ci_32chars_min
          POSTGRES_USER: agentic_hire
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: agentic_hire
        run: |
          docker compose build
          docker compose up -d --wait --timeout 120

      - name: Run E2E tests
        env:
          BACKEND_URL: http://localhost:8001
        run: npx playwright test
        working-directory: frontend

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: docker compose down -v

  docker-compose-test:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Compose services
        env:
          AGENTIC_HIRE_OPENROUTER_API_KEY: test_key_for_ci
          AGENTIC_HIRE_JWT_SECRET_KEY: test_jwt_secret_key_for_ci_32chars_min
          POSTGRES_USER: agentic_hire
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: agentic_hire
        run: docker compose build

      - name: Start services
        env:
          AGENTIC_HIRE_OPENROUTER_API_KEY: test_key_for_ci
          AGENTIC_HIRE_JWT_SECRET_KEY: test_jwt_secret_key_for_ci_32chars_min
          POSTGRES_USER: agentic_hire
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: agentic_hire
        run: docker compose up -d --wait --timeout 120

      - name: Check if services are healthy
        run: |
          # Check database
          docker compose exec -T db pg_isready -U agentic_hire || exit 1

          # Check API health (api service maps 8001:8000)
          curl -f http://localhost:8001/health || exit 1

          # Check frontend (maps 3000:3000)
          curl -f http://localhost:3000 || exit 1

      - name: Test graceful shutdown
        run: |
          # docker compose stop sends SIGTERM and waits for clean exit without
          # triggering restart: unless-stopped (unlike docker compose kill)
          docker compose stop
          # All containers should have stopped (Compose V2 uses "running" not "Up")
          if docker compose ps --status=running -q | grep -q .; then
            echo "ERROR: containers still running after docker compose stop"
            docker compose ps -a
            exit 1
          fi
          # Exit code 0 = clean SIGTERM shutdown; 137 = force-killed (SIGKILL timeout)
          api_status=$(docker inspect agentic-hire-api --format='{{.State.ExitCode}}' 2>/dev/null || echo "unknown")
          if [ "$api_status" = "137" ]; then
            echo "WARNING: api was force-killed (exit 137) — did not respond to SIGTERM within grace period"
            exit 1
          fi
          echo "✓ All services exited cleanly (api exit code: $api_status)"

      - name: Cleanup
        if: always()
        run: docker compose down -v
